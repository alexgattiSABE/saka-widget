<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara — Saka Sushi</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400&family=Orbitron:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:   #4FC3F7;
    --violet: #B388FF;
    --deep:   #7C4DFF;
    --dark:   #05050F;
    --glow-b: rgba(79, 195, 247, 0.55);
    --glow-v: rgba(179, 136, 255, 0.45);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
  }

  canvas#stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  .wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 2.5rem;
    padding: 2rem;
  }

  .header { text-align: center; }
  .header .logo {
    font-family: 'Orbitron', monospace;
    font-size: .65rem; letter-spacing: .35em;
    color: var(--blue); opacity: .6;
    text-transform: uppercase; margin-bottom: .5rem;
  }
  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem; font-weight: 300;
    letter-spacing: .1em;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header p {
    margin-top: .5rem;
    font-size: .78rem; letter-spacing: .08em;
    color: rgba(255,255,255,.35);
  }

  .orb-wrap {
    position: relative;
    width: 220px; height: 220px;
    display: flex; align-items: center; justify-content: center;
  }

  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid var(--blue);
    opacity: 0; transform: scale(.6);
    animation: ringPulse 3.6s ease-out infinite;
  }
  .ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
  .ring:nth-child(2) { width: 130%; height: 130%; animation-delay: 1.2s; }
  .ring:nth-child(3) { width: 160%; height: 160%; animation-delay: 2.4s; border-color: var(--violet); }

  @keyframes ringPulse {
    0%   { opacity: 0;   transform: scale(.6); }
    20%  { opacity: .5; }
    100% { opacity: 0;   transform: scale(1.05); }
  }

  .orb {
    position: relative; z-index: 2;
    width: 160px; height: 160px; border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 35% 35%,
      rgba(255,255,255,.18) 0%,
      rgba(79,195,247,.25) 30%,
      rgba(124,77,255,.4)  65%,
      rgba(5,5,15,.9) 100%);
    box-shadow:
      0 0 40px var(--glow-b),
      0 0 80px var(--glow-v),
      inset 0 0 30px rgba(79,195,247,.15);
    transition: transform .3s ease, box-shadow .3s ease;
    animation: orbFloat 4s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .orb::before {
    content: '';
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0%, rgba(79,195,247,.15) 25%,
      transparent 50%, rgba(179,136,255,.15) 75%, transparent 100%);
    animation: orbSpin 6s linear infinite;
  }

  .orb::after {
    content: '';
    position: absolute;
    width: 50px; height: 18px; border-radius: 50%;
    background: rgba(255,255,255,.18);
    top: 28px; left: 32px;
    transform: rotate(-30deg);
    filter: blur(4px);
  }

  @keyframes orbFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
  }
  @keyframes orbSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .orb-icon {
    position: relative; z-index: 3;
    color: rgba(255,255,255,.7);
    font-size: 1.8rem;
    transition: opacity .3s;
    pointer-events: none;
  }

  .orb.active {
    box-shadow:
      0 0 60px var(--glow-b),
      0 0 120px var(--glow-v),
      0 0 180px rgba(124,77,255,.3),
      inset 0 0 40px rgba(79,195,247,.2);
    animation: orbFloat 4s ease-in-out infinite, orbPulse 1s ease-in-out infinite;
  }
  @keyframes orbPulse {
    0%, 100% { transform: translateY(-5px) scale(1); }
    50%       { transform: translateY(-15px) scale(1.06); }
  }

  .bars {
    position: absolute; z-index: 3;
    display: flex; align-items: center; gap: 4px;
    opacity: 0; transition: opacity .4s;
  }
  .bar {
    width: 4px; border-radius: 2px;
    background: linear-gradient(to top, var(--blue), var(--violet));
    animation: barDance .8s ease-in-out infinite alternate;
  }
  .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .bar:nth-child(2) { height: 22px; animation-delay: .15s; }
  .bar:nth-child(3) { height: 32px; animation-delay: .3s; }
  .bar:nth-child(4) { height: 22px; animation-delay: .45s; }
  .bar:nth-child(5) { height: 12px; animation-delay: .6s; }

  @keyframes barDance {
    from { transform: scaleY(.4); opacity: .6; }
    to   { transform: scaleY(1.2); opacity: 1; }
  }

  .orb.active .bars    { opacity: 1; }
  .orb.active .orb-icon { opacity: 0; }

  .status {
    font-family: 'Orbitron', monospace;
    font-size: .65rem; letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(255,255,255,.4);
    transition: color .4s;
    min-height: 1rem;
  }
  .status.listening { color: var(--blue); }
  .status.speaking  { color: var(--violet); }
  .status.error     { color: #ff6b6b; }

  .subtitle {
    font-size: .72rem; letter-spacing: .06em;
    color: rgba(255,255,255,.25);
    text-align: center; max-width: 240px;
    line-height: 1.6;
  }

  .btn-end {
    display: none;
    padding: .5rem 1.4rem;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 100px;
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.4);
    font-family: 'Orbitron', monospace;
    font-size: .6rem; letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .3s;
  }
  .btn-end:hover {
    border-color: rgba(255,100,100,.4);
    color: rgba(255,100,100,.7);
    background: rgba(255,50,50,.05);
  }
  .btn-end.visible { display: block; }

  .brand {
    position: fixed; bottom: 1.4rem;
    font-family: 'Orbitron', monospace;
    font-size: .5rem; letter-spacing: .3em;
    color: rgba(255,255,255,.12);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="wrapper">
  <div class="header">
    <div class="logo">Saka Sushi — AI Concierge</div>
    <h1>SARA</h1>
    <p>Assistente vocale intelligente</p>
  </div>

  <div class="orb-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="orb" id="orb">
      <div class="bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="orb-icon">🎙</div>
    </div>
  </div>

  <div class="status" id="status">Tocca per parlare</div>
  <div class="subtitle">Prenota un tavolo, chiedi il menu<br>o scopri gli orari — a voce.</div>
  <button class="btn-end" id="btnEnd">Termina chiamata</button>
</div>

<div class="brand">Powered by Booka AI</div>
 
<script src="https://cdn.jsdelivr.net/npm/retell-client-js-sdk@2.0.7/dist/index.umd.js"></script>
<script>
// ── Starfield ──
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

for (let i = 0; i < 160; i++) {
  stars.push({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.2 + .2,
    a: Math.random(),
    s: (Math.random() * .3 + .1) * (Math.random() < .5 ? 1 : -1)
  });
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.a += s.s * .005;
    if (s.a > 1) { s.a = 1; s.s *= -1; }
    if (s.a < 0) { s.a = 0; s.s *= -1; }
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(179,200,255,${s.a * .8})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

// ── Retell ──
const orb      = document.getElementById('orb');
const statusEl = document.getElementById('status');
const btnEnd   = document.getElementById('btnEnd');
let client = null;
let active = false;

async function startCall() {
  if (active) return;
  statusEl.textContent = 'Connessione...';
  statusEl.className   = 'status';

  try {
    // 1. Ottieni access token dal nostro server
    const res = await fetch('/api/token', { method: 'POST' });
    const data = await res.json();

    if (!data.access_token) throw new Error('Token non ricevuto');

    // 2. Avvia chiamata web con Retell SDK
    const RetellWebClient = window.RetellWebClient;
    if (!RetellWebClient) throw new Error('SDK non caricato');

    client = new RetellWebClient();

    client.on('call_started', () => {
      active = true;
      orb.classList.add('active');
      statusEl.textContent = 'In ascolto...';
      statusEl.className   = 'status listening';
      btnEnd.classList.add('visible');
    });

    client.on('agent_start_talking', () => {
      statusEl.textContent = 'Sara sta parlando...';
      statusEl.className   = 'status speaking';
    });

    client.on('agent_stop_talking', () => {
      statusEl.textContent = 'In ascolto...';
      statusEl.className   = 'status listening';
    });

    client.on('call_ended', () => endCall());
    client.on('error', (e) => { console.error(e); endCall(); });

    await client.startCall({
      accessToken: data.access_token,
      sampleRate: 24000,
    });

  } catch(e) {
    console.error(e);
    statusEl.textContent = 'Errore — riprova';
    statusEl.className   = 'status error';
    active = false;
  }
}

function endCall() {
  if (client) { try { client.stopCall(); } catch(e){} }
  client = null; active = false;
  orb.classList.remove('active');
  statusEl.textContent = 'Tocca per parlare';
  statusEl.className   = 'status';
  btnEnd.classList.remove('visible');
}

orb.addEventListener('click', () => { if (!active) startCall(); });
btnEnd.addEventListener('click', endCall);
</script>
</body>
</html>
