<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex — Sabe Ristorante Giapponese</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%;height:100%;overflow:hidden;background:#05030f;user-select:none; }
.ui {
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
}
.ui::before {
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,rgba(0,50,120,0.22) 0%,transparent 70%);
  pointer-events:none;
}
.brand {
  font-family:monospace;font-weight:500;
  font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;
  color:rgba(0,212,255,.8);margin-bottom:1.2rem;
  animation:fadeUp 2s ease forwards;
}
.orb-wrap {
  position:relative;width:300px;height:300px;
  cursor:pointer;pointer-events:all;
  animation:fadeUp 2s ease .3s both;
}
#sphere-c { display:block;position:relative;z-index:2; }
.ring {
  position:absolute;border-radius:50%;
  border:1px solid rgba(0,212,255,0);
  transition:border-color .6s;pointer-events:none;
}
.ring1{inset:-30px;} .ring1.on{border-color:rgba(0,212,255,.25);animation:pulse 2.2s ease-in-out infinite;}
.ring2{inset:-60px;} .ring2.on{border-color:rgba(0,232,162,.12);animation:pulse 3s ease-in-out infinite .8s;}
.ring3{inset:-95px;} .ring3.on{border-color:rgba(0,212,255,.06);animation:pulse 3.8s ease-in-out infinite 1.6s;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.03);opacity:1}}
.sara-name {
  font-family:monospace;font-weight:500;
  font-size:2.2rem;letter-spacing:.15em;color:#fff;
  margin-top:1.2rem;animation:fadeUp 2s ease .6s both;
  text-shadow:0 0 30px rgba(0,212,255,.6),0 0 60px rgba(0,212,255,.25);
}
.ristorante {
  font-family:monospace;font-weight:400;
  font-size:.52rem;letter-spacing:.35em;text-transform:uppercase;
  color:rgba(0,212,255,.45);margin-top:.4rem;animation:fadeUp 2s ease .8s both;
}
.status {
  font-family:monospace;font-weight:400;
  font-size:.58rem;letter-spacing:.25em;text-transform:uppercase;
  color:rgba(0,180,220,.4);margin-top:1.3rem;
  transition:color .5s,text-shadow .5s;pointer-events:none;
  animation:fadeUp 2s ease 1s both;min-height:.8rem;
}
.status.listening{color:#00e8a2;text-shadow:0 0 14px rgba(0,232,162,.8);}
.status.speaking{color:#00d4ff;text-shadow:0 0 14px rgba(0,212,255,.8);}
.status.error{color:#ff6b6b;}
.hint{
  font-family:monospace;font-weight:300;
  font-size:.6rem;letter-spacing:.12em;
  color:rgba(0,180,220,.25);margin-top:.4rem;
  animation:fadeUp 2s ease 1.2s both;
}
.btn-end{
  display:none;margin-top:1rem;padding:.4rem 1.6rem;border-radius:100px;
  border:1px solid rgba(0,212,255,.2);background:transparent;
  color:rgba(0,212,255,.4);font-family:monospace;
  font-size:.48rem;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;transition:all .3s;pointer-events:all;
}
.btn-end:hover{border-color:rgba(255,80,80,.4);color:rgba(255,80,80,.6);}
.btn-end.visible{display:block;}
.footer{
  position:fixed;bottom:1rem;font-family:monospace;
  font-size:.38rem;letter-spacing:.35em;text-transform:uppercase;
  color:rgba(255,255,255,.04);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="ui">
  <div class="brand">Sabe — Ristorante Giapponese</div>
  <div class="orb-wrap" id="orbHit">
    <canvas id="sphere-c" width="300" height="300"></canvas>
    <div class="ring ring1" id="r1"></div>
    <div class="ring ring2" id="r2"></div>
    <div class="ring ring3" id="r3"></div>
  </div>
  <div class="sara-name">ALEX</div>
  <div class="ristorante">Assistente vocale</div>
  <div class="status" id="status">Tocca per parlare</div>
  <div class="hint">Prenota · Menu · Orari</div>
  <button class="btn-end" id="btnEnd">Termina</button>
</div>
<div class="footer">Powered by Axxell AI</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('sphere-c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(300,300);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55,1,0.1,100);
  camera.position.z = 3.1;
  const phi = Math.PI*(3-Math.sqrt(5));

  function makeLayer(N, radius, size, col, opac) {
    const pos = new Float32Array(N*3);
    const base = new Float32Array(N*3);
    const ph = new Float32Array(N);
    for(let i=0;i<N;i++){
      const y=1-(i/(N-1))*2, r=Math.sqrt(Math.max(0,1-y*y));
      const t=phi*i;
      const x=Math.cos(t)*r*radius, yy=y*radius, z=Math.sin(t)*r*radius;
      pos[i*3]=x; pos[i*3+1]=yy; pos[i*3+2]=z;
      base[i*3]=x; base[i*3+1]=yy; base[i*3+2]=z;
      ph[i]=Math.random()*Math.PI*2;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({ size, color:col, transparent:true, opacity:opac, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
    const pts=new THREE.Points(geo,mat);
    scene.add(pts);
    return {pts,geo,base,ph};
  }

  const layers = [
    { ...makeLayer(2000, 1.00, 0.022, 0x0066aa, 0.9), speed:1.0, baseCol:0x0066aa },
    { ...makeLayer(1000, 0.91, 0.017, 0x00b4e0, 0.8), speed:1.4, baseCol:0x00b4e0 },
    { ...makeLayer(500,  0.76, 0.014, 0x00d4ff, 0.75),speed:1.9, baseCol:0x00d4ff },
  ];

  let sphereMode = 'idle';
  let clock = 0;
  let targetLvl = 0, lvl = 0;

  function noise(x,y,z){
    return (Math.sin(x*6.28+y*3.77)*Math.cos(z*4.71+x*2.1)+
            Math.sin(y*5.13+z*2.69)*Math.cos(x*3.33+y*1.5))*0.5;
  }

  function tick(){
    requestAnimationFrame(tick);
    clock += 0.011;
    lvl += (targetLvl - lvl)*0.06;
    let wAmp=0.038, wFreq=2.6, nAmp=0.022, rY=0.0025, rX=0.0008, scale=1.0;
    if(sphereMode==='idle'){
      wAmp=0.038+Math.sin(clock*0.4)*0.008; wFreq=2.5; nAmp=0.022; rY=0.0022;
    } else if(sphereMode==='listening'){
      wAmp=0.055+lvl*0.09; wFreq=3.8+lvl*2; nAmp=0.035+lvl*0.07; rY=0.005; scale=1+lvl*0.05;
    } else if(sphereMode==='speaking'){
      wAmp=0.09+lvl*0.20; wFreq=5.5+lvl*4; nAmp=0.065+lvl*0.16; rY=0.009; scale=1+lvl*0.12;
    }
    layers.forEach(({pts,geo,base,ph,speed,baseCol},li)=>{
      const pos=geo.attributes.position.array;
      const lt=clock*speed;
      for(let i=0,n=pos.length/3;i<n;i++){
        const bx=base[i*3],by=base[i*3+1],bz=base[i*3+2];
        const len=Math.sqrt(bx*bx+by*by+bz*bz)||1;
        const nx=bx/len,ny=by/len;
        const wave= Math.sin(ny*Math.PI*wFreq+lt*1.9+ph[i])*wAmp
                  + Math.sin(nx*Math.PI*wFreq*0.7+lt*1.3+ph[i]*0.5)*wAmp*0.45
                  + Math.sin((bx+bz)*Math.PI*wFreq*0.5+lt*2.4+ph[i]*0.3)*wAmp*0.3;
        const n3=noise(bx*2.2+lt*0.35,by*2.2+lt*0.28,bz*2.2+lt*0.32)*nAmp;
        const d=1+wave+n3;
        pos[i*3]=bx*d*scale; pos[i*3+1]=by*d*scale; pos[i*3+2]=bz*d*scale;
      }
      geo.attributes.position.needsUpdate=true;
      let tc;
      if(sphereMode==='speaking'){
        tc=li===2?new THREE.Color(0x00e8a2):li===1?new THREE.Color(0x00b4e0):new THREE.Color(0x0066aa);
      } else {
        tc=new THREE.Color(baseCol);
      }
      pts.material.color.lerp(tc,0.04);
      pts.material.opacity=[0.9,0.8,0.72][li]+Math.sin(clock*1.6+li)*0.04;
      pts.rotation.y+=rY*(1+li*0.18);
      pts.rotation.x+=rX*(1-li*0.08);
      pts.rotation.z+=rY*0.28*(li%2===0?1:-1);
    });
    renderer.render(scene,camera);
  }
  tick();

  let simTimer=null;
  function simAudio(){
    if(sphereMode==='speaking') targetLvl=0.4+Math.random()*0.6;
    else if(sphereMode==='listening') targetLvl=0.1+Math.random()*0.35;
    else targetLvl=0;
  }

  window.setSphereMode = function(m){
    sphereMode = m;
    clearInterval(simTimer);
    if(m!=='idle') simTimer=setInterval(simAudio,120);
    else targetLvl=0;
  };
})();
</script>

<script>
const orbHit=document.getElementById('orbHit');
const statusEl=document.getElementById('status');
const btnEnd=document.getElementById('btnEnd');
const r1=document.getElementById('r1'),r2=document.getElementById('r2'),r3=document.getElementById('r3');
let client=null,active=false;

async function startCall(){
  if(active)return;
  try {
    // Solo probe del permesso: chiudi subito lo stream (l'SDK Retell apre il suo),
    // altrimenti l'indicatore del microfono resta acceso anche a chiamata finita
    const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
    probe.getTracks().forEach(t => t.stop());
  } catch(err) {
    statusEl.textContent='Microfono non autorizzato';
    statusEl.className='status error';
    return;
  }
  statusEl.textContent='Connessione...';
  statusEl.className='status';
  try{
    const res=await fetch('/api/token',{method:'POST'});
    const data=await res.json();
    if(!data.access_token)throw new Error('Token non ricevuto');
    const SDK=window.RetellSDK;
    if(!SDK)throw new Error('SDK non caricato');
    const RWC=SDK.RetellWebClient||SDK.default?.RetellWebClient||SDK.default;
    if(!RWC)throw new Error('Client non trovato');
    client=new RWC();
    client.on('call_started',()=>{
      active=true;
      r1.classList.add('on');r2.classList.add('on');r3.classList.add('on');
      statusEl.textContent='In ascolto...';statusEl.className='status listening';
      btnEnd.classList.add('visible');
      window.setSphereMode('listening');
    });
    client.on('agent_start_talking',()=>{
      statusEl.textContent='Alex sta parlando...';statusEl.className='status speaking';
      window.setSphereMode('speaking');
    });
    client.on('agent_stop_talking',()=>{
      statusEl.textContent='In ascolto...';statusEl.className='status listening';
      window.setSphereMode('listening');
    });
    client.on('call_ended',()=>endCall());
    client.on('error',(e)=>{console.error(e);endCall();});
    await client.startCall({accessToken:data.access_token,sampleRate:24000});
  }catch(e){
    console.error(e);
    statusEl.textContent='Errore: '+e.message;
    statusEl.className='status error';
    active=false;
    window.setSphereMode('idle');
  }
}

function endCall(){
  if(client){try{client.stopCall();}catch(e){}}
  client=null;active=false;
  r1.classList.remove('on');r2.classList.remove('on');r3.classList.remove('on');
  statusEl.textContent='Tocca per parlare';statusEl.className='status';
  btnEnd.classList.remove('visible');
  window.setSphereMode('idle');
}

orbHit.addEventListener('click',()=>{if(!active)startCall();});
btnEnd.addEventListener('click',endCall);
</script>
<script src="/retell-sdk.js"></script>
</body>
</html>
