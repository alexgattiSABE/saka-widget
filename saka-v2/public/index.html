<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabe — Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#060609;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;position:relative;background:#060609;}
#app::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 70% at 50% 50%,rgba(0,50,120,.22) 0%,transparent 70%);pointer-events:none;}
.header{text-align:center;margin-bottom:2rem;position:relative;z-index:3;}
.title{font-family:monospace;font-size:1.1rem;font-weight:500;letter-spacing:.25em;color:#00d4ff;margin-bottom:.3rem;}
.subtitle{font-family:monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,180,220,.45);}
#sphere-c{display:block;position:relative;z-index:2;cursor:pointer;}
.status{font-family:monospace;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;margin-top:1.5rem;z-index:3;position:relative;transition:color .3s;}
.status.idle{color:rgba(0,200,255,.5);}
.status.listening{color:#00e8a2;}
.status.speaking{color:#00d4ff;}
.hint{font-family:monospace;font-size:.6rem;letter-spacing:.08em;color:rgba(0,180,220,.3);margin-top:.5rem;z-index:3;position:relative;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="title">SABE</div>
    <div class="subtitle">Ristorante Giapponese · Demo Interattiva</div>
  </div>
  <canvas id="sphere-c" width="300" height="300"></canvas>
  <div class="status idle" id="status">● sistema pronto</div>
  <div class="hint" id="hint">Tocca per parlare con Sabe</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var canvas=document.getElementById('sphere-c');
var renderer,scene,camera,layers;
var mode='idle',clock=0,targetLvl=0,lvl=0;
var phi=Math.PI*(3-Math.sqrt(5));

function initSphere(){
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(300,300);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(55,1,0.1,100);
  camera.position.z=3.1;
  function makeLayer(N,radius,size,col,opac){
    var pos=new Float32Array(N*3),base=new Float32Array(N*3),ph=new Float32Array(N);
    for(var i=0;i<N;i++){var y=1-(i/(N-1))*2,r=Math.sqrt(Math.max(0,1-y*y)),t=phi*i,x=Math.cos(t)*r*radius,yy=y*radius,z=Math.sin(t)*r*radius;pos[i*3]=x;pos[i*3+1]=yy;pos[i*3+2]=z;base[i*3]=x;base[i*3+1]=yy;base[i*3+2]=z;ph[i]=Math.random()*Math.PI*2;}
    var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    var mat=new THREE.PointsMaterial({size:size,color:col,transparent:true,opacity:opac,sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false});
    var pts=new THREE.Points(geo,mat);scene.add(pts);return{pts:pts,geo:geo,base:base,ph:ph};
  }
  layers=[
    Object.assign(makeLayer(2000,1.00,0.022,0x0088cc,0.9),{speed:1.0,baseCol:0x0088cc}),
    Object.assign(makeLayer(1000,0.91,0.017,0x00b4e0,0.8),{speed:1.4,baseCol:0x00b4e0}),
    Object.assign(makeLayer(500,0.76,0.014,0x00d4ff,0.75),{speed:1.9,baseCol:0x00d4ff}),
  ];
  tick();
}

function noise(x,y,z){return(Math.sin(x*6.28+y*3.77)*Math.cos(z*4.71+x*2.1)+Math.sin(y*5.13+z*2.69)*Math.cos(x*3.33+y*1.5))*0.5;}

function tick(){
  requestAnimationFrame(tick);clock+=0.011;lvl+=(targetLvl-lvl)*0.06;
  var wAmp=0.038,wFreq=2.6,nAmp=0.022,rY=0.0025,rX=0.0008,scale=1.0;
  if(mode==='idle'){wAmp=0.038+Math.sin(clock*0.4)*0.008;wFreq=2.5;nAmp=0.022;rY=0.0022;}
  else if(mode==='listening'){wAmp=0.055+lvl*0.09;wFreq=3.8+lvl*2;nAmp=0.035+lvl*0.07;rY=0.005;scale=1+lvl*0.05;}
  else if(mode==='speaking'){wAmp=0.09+lvl*0.20;wFreq=5.5+lvl*4;nAmp=0.065+lvl*0.16;rY=0.009;scale=1+lvl*0.12;}
  layers.forEach(function(L,li){
    var pos=L.geo.attributes.position.array,lt=clock*L.speed;
    for(var i=0,n=pos.length/3;i<n;i++){var bx=L.base[i*3],by=L.base[i*3+1],bz=L.base[i*3+2],len=Math.sqrt(bx*bx+by*by+bz*bz)||1,nx=bx/len,ny=by/len,wave=Math.sin(ny*Math.PI*wFreq+lt*1.9+L.ph[i])*wAmp+Math.sin(nx*Math.PI*wFreq*0.7+lt*1.3+L.ph[i]*0.5)*wAmp*0.45+Math.sin((bx+bz)*Math.PI*wFreq*0.5+lt*2.4+L.ph[i]*0.3)*wAmp*0.3,n3=noise(bx*2.2+lt*0.35,by*2.2+lt*0.28,bz*2.2+lt*0.32)*nAmp,d=1+wave+n3;pos[i*3]=bx*d*scale;pos[i*3+1]=by*d*scale;pos[i*3+2]=bz*d*scale;}
    L.geo.attributes.position.needsUpdate=true;
    var tc=mode==='speaking'?(li===2?new THREE.Color(0x00e8a2):li===1?new THREE.Color(0x00b4e0):new THREE.Color(0x0066aa)):new THREE.Color(L.baseCol);
    L.pts.material.color.lerp(tc,0.04);
    L.pts.material.opacity=[0.9,0.8,0.72][li]+Math.sin(clock*1.6+li)*0.04;
    L.pts.rotation.y+=rY*(1+li*0.18);L.pts.rotation.x+=rX*(1-li*0.08);L.pts.rotation.z+=rY*0.28*(li%2===0?1:-1);
  });
  renderer.render(scene,camera);
}

function setSphereMode(m){
  mode=m;
  var statusEl=document.getElementById('status');
  var hintEl=document.getElementById('hint');
  statusEl.className='status '+m;
  var labels={idle:'● sistema pronto',listening:'◉ in ascolto…',speaking:'◈ Sabe sta parlando'};
  statusEl.textContent=labels[m]||m;
  if(m==='idle') hintEl.textContent='Tocca per parlare con Sabe';
  else if(m==='listening') hintEl.textContent='Parla ora…';
  else hintEl.textContent='';
}

var simTimer=null;
function startSim(){
  clearInterval(simTimer);
  simTimer=setInterval(function(){
    if(mode==='listening') targetLvl=0.1+Math.random()*0.35;
    else if(mode==='speaking') targetLvl=0.4+Math.random()*0.6;
    else targetLvl=0;
  },120);
}

var retellClient=null,callActive=false;

function loadRetellSDK(){
  return new Promise(function(resolve){
    if(window.RetellWebClient){resolve();return;}
    var s=document.createElement('script');
    s.src='https://unpkg.com/retell-client-js-sdk@latest/dist/index.umd.js';
    s.onload=function(){resolve();};
    document.head.appendChild(s);
  });
}

async function startCall(){
  if(callActive){stopCall();return;}
  setSphereMode('listening');
  document.getElementById('hint').textContent='Connessione in corso…';
  try{
    var res=await fetch('/api/token',{method:'POST'});
    var data=await res.json();
    if(!data.access_token) throw new Error('No token');
    await loadRetellSDK();
    if(!retellClient){
      retellClient=new RetellWebClient();
      retellClient.on('call_started',function(){callActive=true;setSphereMode('listening');startSim();});
      retellClient.on('agent_start_talking',function(){setSphereMode('speaking');});
      retellClient.on('agent_stop_talking',function(){setSphereMode('listening');});
      retellClient.on('call_ended',function(){callActive=false;setSphereMode('idle');clearInterval(simTimer);targetLvl=0;});
      retellClient.on('error',function(err){console.error(err);callActive=false;setSphereMode('idle');clearInterval(simTimer);targetLvl=0;});
    }
    await retellClient.startCall({accessToken:data.access_token});
  }catch(err){
    console.error('Call error:',err);
    setSphereMode('idle');
  }
}

function stopCall(){
  if(retellClient&&callActive) retellClient.stopCall();
  callActive=false;setSphereMode('idle');clearInterval(simTimer);targetLvl=0;
}

canvas.addEventListener('click',function(){startCall();});
initSphere();
</script>
</body>
</html>
