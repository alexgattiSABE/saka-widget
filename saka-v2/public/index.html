<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara — Sabe Ristorante Giapponese</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Orbitron:wght@200;300&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%;height:100%;overflow:hidden;background:#000;user-select:none; }
  .ui {
    position:fixed;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;pointer-events:none;
  }
  .brand {
    font-family:'Orbitron',monospace;font-weight:300;
    font-size:.7rem;letter-spacing:.5em;text-transform:uppercase;
    color:rgba(0,220,180,.9);margin-bottom:1.8rem;
    text-shadow:0 0 20px rgba(0,220,180,.8),0 0 50px rgba(0,220,180,.3);
    animation:fadeUp 2s ease forwards;
  }
  .orb-wrap {
    position:relative;width:320px;height:320px;
    cursor:pointer;pointer-events:all;
    animation:fadeUp 2s ease .3s both;
    filter:drop-shadow(0 0 40px rgba(0,150,255,.5)) drop-shadow(0 0 80px rgba(0,150,255,.2));
  }
  #plasmaCanvas { position:absolute;inset:0;width:320px;height:320px; }
  .ring {
    position:absolute;border-radius:50%;
    border:1px solid rgba(120,80,255,0);
    transition:border-color .6s;pointer-events:none;
  }
  .ring1{inset:-30px;} .ring1.on{border-color:rgba(0,180,255,.3);animation:pulse 2.2s ease-in-out infinite;}
  .ring2{inset:-60px;} .ring2.on{border-color:rgba(0,220,180,.15);animation:pulse 3s ease-in-out infinite .8s;}
  .ring3{inset:-95px;} .ring3.on{border-color:rgba(0,200,160,.07);animation:pulse 3.8s ease-in-out infinite 1.6s;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.03);opacity:1}}
  .sara-name {
    font-family:'Orbitron',monospace;font-weight:200;
    font-size:2.2rem;letter-spacing:.08em;color:#fff;
    margin-top:1.4rem;animation:fadeUp 2s ease .6s both;
    text-shadow:0 0 30px rgba(0,200,255,.7),0 0 60px rgba(0,200,255,.3);
  }
  .ristorante {
    font-family:'Orbitron',monospace;font-weight:200;
    font-size:.52rem;letter-spacing:.45em;text-transform:uppercase;
    color:rgba(0,200,160,.7);margin-top:.4rem;animation:fadeUp 2s ease .8s both;
  }
  .status {
    font-family:'Orbitron',monospace;font-weight:300;
    font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(255,255,255,.4);margin-top:1.3rem;
    transition:color .5s,text-shadow .5s;pointer-events:none;
    animation:fadeUp 2s ease 1s both;min-height:.8rem;
  }
  .status.listening{color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.9);}
  .status.speaking{color:#00ffb0;text-shadow:0 0 14px rgba(0,255,176,.9);}
  .status.error{color:#ff6b6b;}
  .hint{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:1rem;letter-spacing:.15em;
    color:rgba(255,255,255,.15);margin-top:.4rem;
    animation:fadeUp 2s ease 1.2s both;
  }
  .btn-end{
    display:none;margin-top:1rem;padding:.4rem 1.6rem;border-radius:100px;
    border:1px solid rgba(0,180,180,.25);background:transparent;
    color:rgba(0,200,180,.5);font-family:'Orbitron',monospace;
    font-size:.48rem;letter-spacing:.2em;text-transform:uppercase;
    cursor:pointer;transition:all .3s;pointer-events:all;
  }
  .btn-end:hover{border-color:rgba(255,80,80,.4);color:rgba(255,80,80,.6);}
  .btn-end.visible{display:block;}
  .footer{
    position:fixed;bottom:1rem;font-family:'Orbitron',monospace;
    font-size:.38rem;letter-spacing:.35em;text-transform:uppercase;
    color:rgba(255,255,255,.05);
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="ui">
  <div class="brand">Sabe — Ristorante Giapponese</div>
  <div class="orb-wrap" id="orbHit">
    <canvas id="plasmaCanvas"></canvas>
    <div class="ring ring1" id="r1"></div>
    <div class="ring ring2" id="r2"></div>
    <div class="ring ring3" id="r3"></div>
  </div>
  <div class="sara-name">SARA</div>
  <div class="ristorante">Assistente vocale</div>
  <div class="status" id="status">Tocca per parlare</div>
  <div class="hint">Prenota · Menu · Orari</div>
  <button class="btn-end" id="btnEnd">Termina</button>
</div>
<div class="footer">Powered by Booka AI</div>
<script>
const canvas=document.getElementById('plasmaCanvas');
const S=320;canvas.width=S;canvas.height=S;
const gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
let isActive=false,isSpeaking=false;
if(gl){
  const VS=`attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.,1.);}`;
  const FS=`
    precision highp float;
    uniform float u_time;uniform float u_active;uniform float u_speaking;
    float hash(float n){return fract(sin(n)*43758.5453);}
    float noise(vec3 p){
      vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.-2.*f);
      float n=i.x+i.y*57.+i.z*113.;
      return mix(mix(mix(hash(n),hash(n+1.),f.x),mix(hash(n+57.),hash(n+58.),f.x),f.y),
        mix(mix(hash(n+113.),hash(n+114.),f.x),mix(hash(n+170.),hash(n+171.),f.x),f.y),f.z);
    }
    float fbm(vec3 p){float v=0.;float a=.5;for(int i=0;i<7;i++){v+=a*noise(p);p=p*2.1+vec3(.3,.17,.09);a*=.48;}return v;}
    void main(){
      vec2 uv=(gl_FragCoord.xy-vec2(160.))/160.;
      float dist=length(uv);float R=.97;
      float edge=smoothstep(R+.03,R-.01,dist);
      if(edge<.0005){gl_FragColor=vec4(0.);return;}
      float x=uv.x/R,y=uv.y/R;
      float z=sqrt(max(0.,1.-x*x-y*y));
      vec3 pos=vec3(x,y,z);vec3 N=normalize(pos);
      vec3 L1=normalize(vec3(-.55,.65,.55));
      float d1=max(dot(N,L1),0.);
      float s1=pow(max(dot(reflect(-L1,N),vec3(0.,0.,1.)),0.),64.);
      vec3 L2=normalize(vec3(.7,-.2,.4));float d2=max(dot(N,L2),0.)*.3;
      vec3 L3=normalize(vec3(.1,.1,-1.));float d3=max(dot(N,L3),0.)*.15;
      float fresnel=pow(1.-z,2.8);
      float spd=.8+u_active*1.2;float t=u_time*spd;
      vec3 q=vec3(fbm(pos*1.8+vec3(t*.15,t*.12,t*.08)),fbm(pos*1.8+vec3(t*.12,-t*.1,t*.15)+2.4),fbm(pos*1.8+vec3(-t*.1,t*.13,-t*.12)+4.8));
      vec3 r=vec3(fbm(pos*2.5+q*1.8+vec3(t*.2,t*.18,t*.14)),fbm(pos*2.5+q*1.8+vec3(t*.18,-t*.16,t*.2)+1.7),fbm(pos*2.5+q*1.8+vec3(-t*.16,t*.19,-t*.17)+3.4));
      float plasma=fbm(pos*2.+r*2.2);
      plasma=clamp(plasma*2.4-.55,0.,1.);
      float detail=fbm(pos*6.+vec3(t*.3,-t*.25,t*.2));
      detail=clamp(detail*3.-1.5,0.,1.);
      plasma=mix(plasma,max(plasma,detail*.7),.3);
      float sp=u_speaking;
      vec3 void_col=vec3(0.,0.,0.);
      vec3 deep=mix(vec3(.0,.04,.18),vec3(.0,.08,.2),sp);
      vec3 mid1=mix(vec3(.0,.2,.6),vec3(.0,.35,.45),sp);
      vec3 mid2=mix(vec3(.0,.55,.85),vec3(.05,.7,.6),sp);
      vec3 bright=mix(vec3(.1,.85,1.),vec3(.1,1.,.75),sp);
      vec3 corona=mix(vec3(.5,.95,1.),vec3(.4,1.,.85),sp);
      vec3 white_hot=vec3(.97,.94,1.);
      vec3 col;
      if(plasma<.15)col=mix(void_col,deep,plasma/.15);
      else if(plasma<.35)col=mix(deep,mid1,(plasma-.15)/.2);
      else if(plasma<.55)col=mix(mid1,mid2,(plasma-.35)/.2);
      else if(plasma<.72)col=mix(mid2,bright,(plasma-.55)/.17);
      else if(plasma<.88)col=mix(bright,corona,(plasma-.72)/.16);
      else col=mix(corona,white_hot,(plasma-.88)/.12);
      float lum=smoothstep(.4,1.,plasma);
      col*=(1.+lum*(1.5+u_active*1.2));
      float f1=sin(pos.x*14.+pos.y*11.+t*3.)*.5+.5;
      float f2=sin(pos.y*16.-pos.z*8.+t*2.5)*.5+.5;
      float f3=cos(pos.z*12.+pos.x*9.-t*2.)*.5+.5;
      float fil=pow(pow(f1*f2,.5)*pow(f3,.3),4.)*(1.5+u_active*1.5);
      col+=mix(vec3(.2,.8,1.),vec3(.1,1.,.7),sp)*fil;
      col*=(.12+d1*.7+d2+d3);
      col+=mix(vec3(.3,.7,1.),vec3(.2,1.,.8),sp)*s1*.8;
      col+=mix(vec3(.0,.5,.9),vec3(.0,.9,.7),sp)*fresnel*(.6+u_active*.5);
      col+=vec3(.9,.85,1.)*pow(max(dot(N,normalize(vec3(-.4,.55,.75))),0.),80.)*.5;
      col*=(.6+smoothstep(.0,.4,z)*smoothstep(1.,.6,z)*.4);
      col=max(col,vec3(0.));
      float alpha=edge*(smoothstep(.0,.4,plasma)*.7+plasma*.3);
      gl_FragColor=vec4(col,alpha);
    }`;
  function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'a_pos');
  gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uTime=gl.getUniformLocation(prog,'u_time');
  const uActive=gl.getUniformLocation(prog,'u_active');
  const uSpeak=gl.getUniformLocation(prog,'u_speaking');
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  let start=Date.now();
  function render(){
    gl.viewport(0,0,S,S);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime,(Date.now()-start)/1000);
    gl.uniform1f(uActive,isActive?1.:0.);gl.uniform1f(uSpeak,isSpeaking?1.:0.);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(render);
  }
  render();
}
const orbHit=document.getElementById('orbHit');
const statusEl=document.getElementById('status');
const btnEnd=document.getElementById('btnEnd');
const r1=document.getElementById('r1'),r2=document.getElementById('r2'),r3=document.getElementById('r3');
let client=null,active=false;
async function startCall(){
  if(active)return;
  statusEl.textContent='Connessione...';statusEl.className='status';
  try{
    const res=await fetch('/api/token',{method:'POST'});
    const data=await res.json();
    if(!data.access_token)throw new Error('Token non ricevuto');
    const SDK=window.RetellSDK;
    if(!SDK)throw new Error('SDK non caricato');
    const RWC=SDK.RetellWebClient||SDK.default?.RetellWebClient||SDK.default;
    if(!RWC)throw new Error('Client non trovato');
    client=new RWC();
    client.on('call_started',()=>{active=true;isActive=true;r1.classList.add('on');r2.classList.add('on');r3.classList.add('on');statusEl.textContent='In ascolto...';statusEl.className='status listening';btnEnd.classList.add('visible');});
    client.on('agent_start_talking',()=>{isSpeaking=true;statusEl.textContent='Sara sta parlando...';statusEl.className='status speaking';});
    client.on('agent_stop_talking',()=>{isSpeaking=false;statusEl.textContent='In ascolto...';statusEl.className='status listening';});
    client.on('call_ended',()=>endCall());
    client.on('error',(e)=>{console.error(e);endCall();});
    await client.startCall({accessToken:data.access_token,sampleRate:24000});
  }catch(e){console.error(e);statusEl.textContent='Errore: '+e.message;statusEl.className='status error';active=false;isActive=false;}
}
function endCall(){
  if(client){try{client.stopCall();}catch(e){}}
  client=null;active=false;isActive=false;isSpeaking=false;
  r1.classList.remove('on');r2.classList.remove('on');r3.classList.remove('on');
  statusEl.textContent='Tocca per parlare';statusEl.className='status';btnEnd.classList.remove('visible');
}
orbHit.addEventListener('click',()=>{if(!active)startCall();});
btnEnd.addEventListener('click',endCall);
</script>
<script src="/retell-sdk.js"></script>
</body>
</html>
